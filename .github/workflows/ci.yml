name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.22.2 is the lowest version the dependencies support; keep it tested.
        node-version: ['22.22.2', '24.x']
    steps:
      - uses: actions/checkout@v4
        with:
          # latencyReport.test.ts checks the report's steps are commits in this history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Builds, then checks and zips the extension (PR 7.4).
      - run: npm run package
