<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PR Explainer: chat panel demo</title>
    <style>
      body {
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        margin: 24px;
        color: #1f2328;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .controls button {
        padding: 4px 10px;
      }
      .hint {
        color: #59636e;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <h1>Chat panel demo</h1>
    <p class="hint">
      Open the panel with one of the buttons. Type a question and press Enter to send it, or
      Shift+Enter for a new line. A fake answer streams in word by word (no LLM is used). While it
      is being written, Send is disabled.
    </p>
    <div class="controls">
      <button type="button" id="open-conversation">Open with a conversation</button>
      <button type="button" id="open-line">Open about one line</button>
      <button type="button" id="open-unsafe">Open with unsafe model output</button>
    </div>
    <p id="status" class="hint">Last event: none</p>
    <script type="module" src="./chatDemo.ts"></script>
  </body>
</html>
