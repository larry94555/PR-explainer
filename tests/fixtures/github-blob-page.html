b;","    color: #ffffff;","    font: 600 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;","    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);","    user-select: none;","  }","  .badge.off {","    background: #6e7781;","  }","`;","","export function findBadge(doc: Document): HTMLElement | null {","  return doc.getElementById(BADGE_ID);","}","","// Adds the badge for `pr`, or updates it if it is already on the page.","export function showBadge(doc: Document, pr: PrRef): HTMLElement {","  let host = findBadge(doc);","  if (!host) {","    host = doc.createElement('div');","    host.id = BADGE_ID;","    const shadow = host.attachShadow({ mode: 'open' });","    const style = doc.createElement('style');","    style.textContent = STYLE;","    const label = doc.createElement('div');","    label.className = 'badge';","    label.textContent = BADGE_TEXT;","    shadow.append(style, label);","    doc.body.append(host);","  }","  host.dataset.pr = `${pr.owner}/${pr.repo}#${pr.number} (${pr.tab})`;","  updateTooltip(host);","  return host;","}","","// Shows whether click-to-explain is on: \"PR Explainer active\" in blue, or","// \"PR Explainer off\" in grey after the toolbar button turned it off.","// Does nothing if the badge is not on the page.","export function setBadgeEnabled(doc: Document, enabled: boolean): void {","  const label = findBadge(doc)?.shadowRoot?.querySelector\u003cHTMLElement\u003e('.badge');","  if (!label) return;","  label.textContent = enabled ? BADGE_TEXT : BADGE_TEXT_OFF;","  label.classList.toggle('off', !enabled);","}","","// Sets the second tooltip line, for example \"Service worker: connected\".","// Does nothing if the badge is not on the page.","export function setBadgeStatus(doc: Document, status: string): void {","  const host = findBadge(doc);","  if (!host) return;","  host.dataset.status = status;","  updateTooltip(host);","}","","function updateTooltip(host: HTMLElement): void {","  const label = host.shadowRoot?.querySelector\u003cHTMLElement\u003e('.badge');","  if (!label) return;","  label.title = [host.dataset.pr, host.dataset.status].filter(Boolean).join('\\n');","}","","export function removeBadge(doc: Document): void {","  findBadge(doc)?.remove();","}","","// Shows the badge if `url` is a PR page and removes it otherwise.","// Returns the PR it found, or null.","export function syncBadge(doc: Document, url: string): PrRef | null {","  const pr = parsePrUrl(url);","  if (pr) showBadge(doc, pr);","  else removeBadge(doc);","  return pr;","}"],"stylingDirectives":[[[0,76,"pl-c"]],[[0,75,"pl-c"]],[[0,35,"pl-c"]],[],[[0,6,"pl-k"],[7,8,"pl-kos"],[9,19,"pl-s1"],[19,20,"pl-kos"],[21,25,"pl-k"],[26,31,"pl-v"],[32,33,"pl-kos"],[34,38,"pl-k"],[39,48,"pl-s"],[48,49,"pl-kos"]],[],[[0,6,"pl-k"],[7,12,"pl-k"],[13,21,"pl-c1"],[22,23,"pl-c1"],[24,44,"pl-s"],[44,45,"pl-kos"]],[[0,6,"pl-k"],[7,12,"pl-k"],[13,23,"pl-c1"],[24,25,"pl-c1"],[26,47,"pl-s"],[47,48,"pl-kos"]],[[0,6,"pl-k"],[7,12,"pl-k"],[13,27,"pl-c1"],[28,29,"pl-c1"],[30,48,"pl-s"],[48,49,"pl-kos"]],[],[[0,5,"pl-k"],[6,11,"pl-c1"],[12,13,"pl-c1"],[14,15,"pl-s"]],[[0,25,"pl-s"]],[[0,10,"pl-s"]],[[0,20,"pl-s"]],[[0,16,"pl-s"]],[[0,17,"pl-s"]],[[0,24,"pl-s"]],[[0,22,"pl-s"]],[[0,25,"pl-s"]],[[0,24,"pl-s"]],[[0,19,"pl-s"]],[[0,81,"pl-s"]],[[0,46,"pl-s"]],[[0,22,"pl-s"]],[[0,3,"pl-s"]],[[0,14,"pl-s"]],[[0,24,"pl-s"]],[[0,3,"pl-s"]],[[0,1,"pl-s"],[1,2,"pl-kos"]],[],[[0,6,"pl-k"],[7,15,"pl-k"],[16,25,"pl-en"],[25,26,"pl-kos"],[26,29,"pl-s1"],[31,39,"pl-smi"],[39,40,"pl-kos"],[42,53,"pl-smi"],[54,55,"pl-c1"],[56,60,"pl-c1"],[61,62,"pl-kos"]],[[2,8,"pl-k"],[9,12,"pl-s1"],[12,13,"pl-kos"],[13,27,"pl-en"],[27,28,"pl-kos"],[28,36,"pl-c1"],[36,37,"pl-kos"],[37,38,"pl-kos"]],[[0,1,"pl-kos"]],[],[[0,71,"pl-c"]],[[0,6,"pl-k"],[7,15,"pl-k"],[16,25,"pl-en"],[25,26,"pl-kos"],[26,29,"pl-s1"],[31,39,"pl-smi"],[39,40,"pl-kos"],[41,43,"pl-s1"],[45,50,"pl-smi"],[50,51,"pl-kos"],[53,64,"pl-smi"],[65,66,"pl-kos"]],[[2,5,"pl-k"],[6,10,"pl-s1"],[11,12,"pl-c1"],[13,2
